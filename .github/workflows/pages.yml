name: Pages

# Publishes the project page (site/) to GitHub Pages.
# The screenshots live in img/<lang>/ and are copied into the artifact at build
# time, so the repository does not carry a second copy of them.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'img/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site/img
          cp -r img/en img/zh img/ar site/img/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
